name: refresh-volume-data
on:
  schedule:
    - cron: '0 14 * * *'   # 14:00 UTC daily: after DefiLlama's once-a-day adapters have published the previous UTC day
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Run pipeline
        env:
          COINGECKO_DEMO_KEY: ${{ secrets.COINGECKO_DEMO_KEY }}
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: node pipeline/run.mjs
      - name: Commit data
        run: |
          git config user.name "volume-bot"
          git config user.email "volume-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +%Y-%m-%d)"
          git push
